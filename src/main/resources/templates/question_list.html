<!-- 007-03: 새 파일. 질문 목록 템플릿 (책 2-07) -->
<!--         th:each → questionList 를 하나씩 꺼내 <tr>을 반복해서 그린다 -->
<!--         th:text → 태그 안의 글자를 그 값으로 바꾼다 (HTML 특수문자는 자동으로 이스케이프) -->
<!-- 015-03: layout.html 틀을 쓴다. layout:decorate="~{layout}" → templates/layout.html 로 감싼다 -->
<!--         <head> 의 부트스트랩·폰트·공통 CSS 3줄은 layout.html 로 옮겨 여기서 지웠다 (014-01, 014-02, 013-02) -->
<!--         이 화면의 내용은 layout:fragment="content" 조각에 적고, 틀의 같은 이름 자리에 끼워진다 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>질문 목록</title>
</head>
<body>
<!-- 014-03: 부트스트랩 클래스 적용 (책 2-14) -->
<!--         container → 가운데 정렬된 고정 폭 상자, my-3 → 위아래 여백 -->
<!--         table → 줄 간격과 구분선이 있는 표, table-dark → 머리줄을 어두운 색으로 -->
<div layout:fragment="content" class="container my-3">
<!-- 029-03: 검색창 (책 3-13). GET /questions?kw=... 로 보내는 평범한 폼 → 주소에 검색어가 남아 새로고침·공유해도 같은 결과 -->
<!--         책은 숨은 폼과 자바스크립트로 page·kw 를 함께 보내지만, GET 폼과 링크만으로 충분하다 -->
<form th:action="@{/questions}" method="get" class="row g-2 my-3">
    <!-- 029-04: 검색 대상 선택. name="kwType" → ?kwType=subject 처럼 보내진다 -->
    <!--         지금 고른 값을 다시 선택해 두는 일은 029-05 에서 JS 로 한다 (data-value 에 현재 값을 담아 둔다) -->
    <div class="col-auto ms-auto">
        <select name="kwType" class="form-select" th:data-value="${kwType}">
            <option value="all">전체</option>
            <option value="subject">제목</option>
            <option value="content">내용</option>
            <option value="author">글쓴이</option>
        </select>
    </div>
    <div class="col-5">
        <input type="text" name="kw" class="form-control" placeholder="검색어" th:value="${kw}">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-outline-secondary">찾기</button>
    </div>
</form>
<table class="table">
    <thead class="table-dark">
    <tr class="text-center">
        <!-- 019-01: 번호 칸 추가 (책 3-03). text-center → 가운데 정렬, 제목 칸은 넓게(50%) -->
        <th>번호</th>
        <th style="width:50%">제목</th>
        <!-- 024-07: 글쓴이 칸 (책 3-08) -->
        <th>글쓴이</th>
        <th>작성일시</th>
    </tr>
    </thead>
    <tbody>
    <!-- 018-03: 컨트롤러의 모델 이름이 paging 으로 바뀌었다. Page 를 반복하면 이 페이지의 질문들이 나온다 -->
    <!-- 019-01: loop → 반복 상태 변수. loop.index 는 이 페이지 안에서 0부터 세는 순번 -->
    <tr class="text-center" th:each="question, loop : ${paging}">
        <!-- 019-01: 게시물 번호 = 전체 개수 - (현재 페이지 × 페이지 크기) - 페이지 안 순번 -->
        <!--         최신 글이 가장 큰 번호를 갖고, 마지막 페이지 마지막 글이 1번이 된다. id 와 달리 삭제해도 빈 번호가 생기지 않는다 -->
        <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}"></td>
        <!-- 010-04: 제목을 상세 화면 링크로 바꿨다 -->
        <!-- 011-02: 링크 주소 /question/detail/{id} → /questions/{id} -->
        <!--         @{...} → 앱 기준 주소를 만든다. |...| 안에서는 문자열과 ${} 값을 이어 붙일 수 있다 -->
        <!-- 019-01: 제목은 왼쪽 정렬 -->
        <td class="text-start">
            <a th:href="@{|/questions/${question.id}|}" th:text="${question.subject}"></a>
            <!-- 020-01: 답변이 있으면 제목 옆에 개수를 빨간 작은 글씨로 (책 3-04) -->
            <!--         question.answerList(@OneToMany 컬렉션)의 크기를 그대로 쓴다. 답변이 0개면 th:if 로 그리지 않는다 -->
            <span class="text-danger small ms-2" th:if="${#lists.size(question.answerList) > 0}"
                  th:text="${#lists.size(question.answerList)}"></span>
        </td>
        <!-- 024-07: 글쓴이 아이디. ?. → author 가 없으면(024 이전 샘플 데이터) 오류 없이 빈칸 -->
        <td th:text="${question.author?.username}"></td>
        <td th:text="${question.createDate}"></td>
    </tr>
    </tbody>
</table>
<!-- 018-04: 페이지 이동 버튼 (책 3-02, 부트스트랩 pagination) -->
<!--         paging.number 는 0부터 시작하는 현재 페이지 → 화면 번호는 number + 1 (018-03 과 같은 1부터 규칙) -->
<!--         질문이 하나도 없으면 버튼 줄을 그리지 않는다 -->
<div th:if="${!paging.isEmpty()}">
    <ul class="pagination justify-content-center">
        <!-- 018-04: 이전. 첫 페이지면 disabled(회색, 눌리지 않음). 이전 페이지의 화면 번호 = number -->
        <!--         @{/questions(page=...)} → /questions?page=값 형태의 주소를 만든다 -->
        <li class="page-item" th:classappend="${!paging.hasPrevious()} ? 'disabled'">
            <a class="page-link" th:href="@{/questions(page=${paging.number}, kw=${kw}, kwType=${kwType})}">이전</a>
        </li>
        <!-- 029-03: 페이지 링크마다 kw 도 붙인다 → 검색 결과의 2페이지로 가도 검색어가 유지된다 -->
        <!-- 018-04: 페이지 번호. 1부터 전체 페이지 수까지 만들되, 현재 페이지 앞뒤 5개만 보인다 -->
        <!--         현재 페이지는 active(파란 배경) -->
        <li th:each="p : ${#numbers.sequence(1, paging.totalPages)}"
            th:if="${p >= paging.number + 1 - 5 and p <= paging.number + 1 + 5}"
            th:classappend="${p == paging.number + 1} ? 'active'" class="page-item">
            <a th:text="${p}" class="page-link" th:href="@{/questions(page=${p}, kw=${kw}, kwType=${kwType})}"></a>
        </li>
        <!-- 018-04: 다음. 마지막 페이지면 disabled. 다음 페이지의 화면 번호 = number + 2 -->
        <li class="page-item" th:classappend="${!paging.hasNext()} ? 'disabled'">
            <a class="page-link" th:href="@{/questions(page=${paging.number + 2}, kw=${kw}, kwType=${kwType})}">다음</a>
        </li>
    </ul>
</div>
<!-- 016-04: 질문 등록 화면(016-02 GET /questions/new)으로 가는 버튼 (책 2-16) -->
<!--         <a> 링크에 btn 클래스를 붙이면 버튼 모양이 된다 -->
<a th:href="@{/questions/new}" class="btn btn-primary">질문 등록하기</a>
</div>
</body>
</html>
