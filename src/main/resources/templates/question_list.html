<!-- 007-03: 새 파일. 질문 목록 템플릿 (책 2-07) -->
<!--         th:each → questionList 를 하나씩 꺼내 <tr>을 반복해서 그린다 -->
<!--         th:text → 태그 안의 글자를 그 값으로 바꾼다 (HTML 특수문자는 자동으로 이스케이프) -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 014-01: 부트스트랩 CSS를 cdnjs CDN에서 불러온다 (강사식. 책은 파일을 내려받아 static 에 넣는다) -->
    <!--         버전을 5.3.3 으로 고정해 언제 열어도 같은 모양이 나오게 한다. 공통 CSS보다 먼저 불러와야 우리 스타일이 덮어쓸 수 있다 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <!-- 014-02: 한글 웹폰트 Pretendard 를 CDN에서 불러온다 (강사식). 실제 적용은 global.css 의 font-family -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <!-- 013-02: 013-01의 공통 CSS를 불러온다. th:href 의 @{} 는 앱 기준 주소를 만든다 -->
    <link rel="stylesheet" type="text/css" th:href="@{/resource/global.css}">
    <title>질문 목록</title>
</head>
<body>
<!-- 014-03: 부트스트랩 클래스 적용 (책 2-14) -->
<!--         container → 가운데 정렬된 고정 폭 상자, my-3 → 위아래 여백 -->
<!--         table → 줄 간격과 구분선이 있는 표, table-dark → 머리줄을 어두운 색으로 -->
<div class="container my-3">
<table class="table">
    <thead class="table-dark">
    <tr>
        <th>제목</th>
        <th>작성일시</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="question : ${questionList}">
        <!-- 010-04: 제목을 상세 화면 링크로 바꿨다 -->
        <!-- 011-02: 링크 주소 /question/detail/{id} → /questions/{id} -->
        <!--         @{...} → 앱 기준 주소를 만든다. |...| 안에서는 문자열과 ${} 값을 이어 붙일 수 있다 -->
        <td>
            <a th:href="@{|/questions/${question.id}|}" th:text="${question.subject}"></a>
        </td>
        <td th:text="${question.createDate}"></td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
