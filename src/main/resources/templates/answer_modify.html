<!-- 025-09: 새 파일. 답변 수정 화면 (책 3-09). 025-03 질문 수정 화면과 같은 방식 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>답변 수정</title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <h5 class="my-3 border-bottom pb-2">답변 수정</h5>
    <!-- 025-09: POST + _method=put → PUT /questions/{questionId}/answers/{answerId} -->
    <form th:action="@{|/questions/${questionId}/answers/${answerId}|}" th:object="${answerForm}" method="post">
        <input type="hidden" name="_method" value="put">
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" th:errorclass="is-invalid" rows="10" required></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
        </div>
        <input type="submit" value="수정하기" class="btn btn-primary my-2">
    </form>
</div>
</body>
</html>
