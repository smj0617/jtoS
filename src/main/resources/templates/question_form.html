<!-- 016-02: 새 파일. 질문 등록 폼 (책 2-16). 015 레이아웃을 쓰므로 이 화면의 내용만 적는다 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>질문 등록</title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <h5 class="my-3 border-bottom pb-2">질문등록</h5>
    <!-- 016-02: POST /questions 로 보낸다 (016-03 에서 받는 쪽을 만든다) -->
    <!-- 016-06: th:object → 이 폼이 쓸 객체. 컨트롤러가 모델에 담은 questionForm 이다 -->
    <!--         안쪽의 *{필드} 는 이 객체의 필드를 가리킨다 -->
    <form th:action="@{/questions}" th:object="${questionForm}" method="post">
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <!-- 016-06: th:field="*{subject}" → id, name, value 를 한 번에 채운다 -->
            <!--         검증에 실패해 폼이 다시 열려도 사용자가 입력한 값이 그대로 남는다 -->
            <!--         th:errorclass → 이 필드에 오류가 있을 때만 is-invalid(빨간 테두리) 클래스를 더한다 -->
            <input type="text" th:field="*{subject}" class="form-control" th:errorclass="is-invalid">
            <!-- 016-06: 이 필드의 오류 메시지 (QuestionForm 에 적은 message). 오류가 없으면 아예 그리지 않는다 -->
            <div class="invalid-feedback" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" th:errorclass="is-invalid" rows="10"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
        </div>
        <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
</div>
</body>
</html>
