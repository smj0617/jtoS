<!-- 022-06: 새 파일. 회원가입 화면 (책 3-06). 016 질문 폼과 같은 방식: 레이아웃, th:object/th:field, 칸 아래 오류, 브라우저 검증 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>회원가입</title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <h5 class="my-3 border-bottom pb-2">회원가입</h5>
    <!-- 022-06: POST /members 로 보낸다 (받는 쪽은 022-07). th:action 이라 CSRF 토큰이 자동으로 들어간다 (021-03) -->
    <form th:action="@{/members}" th:object="${memberJoinForm}" method="post">
        <!-- 022-06: 비밀번호 불일치·중복 아이디처럼 특정 칸이 아닌 오류(글로벌 오류)를 폼 위에 보여 줄 자리 (022-07 에서 사용) -->
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <!-- 022-06: 브라우저 검증도 서버 규칙(022-05)과 같게: 필수, 3~25자 -->
            <input type="text" th:field="*{username}" class="form-control" th:errorclass="is-invalid"
                   required minlength="3" maxlength="25">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="mb-3">
            <label for="password1" class="form-label">비밀번호</label>
            <!-- 022-06: type="password" → 입력 글자를 ●로 가린다 -->
            <input type="password" th:field="*{password1}" class="form-control" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('password1')}" th:errors="*{password1}"></div>
        </div>
        <div class="mb-3">
            <label for="password2" class="form-label">비밀번호 확인</label>
            <input type="password" th:field="*{password2}" class="form-control" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('password2')}" th:errors="*{password2}"></div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <!-- 022-06: type="email" → 브라우저가 이메일 형식을 먼저 검사한다 -->
            <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <button type="submit" class="btn btn-primary">회원가입</button>
    </form>
</div>
</body>
</html>
