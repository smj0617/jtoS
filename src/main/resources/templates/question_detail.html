<!-- 010-03: 새 파일. 질문 상세 템플릿 (책 2-10). 컨트롤러가 Model 에 담은 question 의 제목과 내용을 보여 준다 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 상세</title>
</head>
<body>
<h1 th:text="${question.subject}"></h1>
<div th:text="${question.content}"></div>

<!-- 012-03: 답변 입력 폼 (책 2-12) -->
<!--         th:action → 012-02 의 POST /questions/{id}/answers 로 보낸다 -->
<!--         textarea 의 name="content" 가 컨트롤러의 @RequestParam content 로 들어간다 -->
<form th:action="@{|/questions/${question.id}/answers|}" method="post">
    <textarea name="content" id="content" rows="15"></textarea>
    <input type="submit" value="답변등록">
</form>
</body>
</html>
