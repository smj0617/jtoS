<!-- 010-03: 새 파일. 질문 상세 템플릿 (책 2-10). 컨트롤러가 Model 에 담은 question 의 제목과 내용을 보여 준다 -->
<!DOCTYPE html>
<!-- 015-04: layout.html 틀을 쓴다 (015-03 목록과 같은 방식). <head> 의 링크 3줄은 layout.html 로 옮겨 지웠다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>질문 상세</title>
</head>
<body>
<!-- 014-04: 상세 화면에 부트스트랩 적용 (책 2-14) -->
<!--         container my-3 → 가운데 고정 폭 + 위아래 여백 -->
<!-- 015-04: 이 div 가 layout.html 의 content 자리에 들어간다 -->
<div layout:fragment="content" class="container my-3">
    <!-- 014-04: 질문 제목. border-bottom → 아래 구분선, py-2 → 위아래 안쪽 여백 -->
    <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>
    <!-- 014-04: 질문 내용을 카드(테두리 있는 상자)에 담는다 -->
    <!--         white-space: pre-line → 내용의 줄바꿈을 화면에도 줄바꿈으로 보여 준다 -->
    <div class="card my-3">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;" th:text="${question.content}"></div>
            <!-- 024-07: 카드 오른쪽 아래에 글쓴이 (책 3-08). 글쓴이가 없는 옛 질문이면 th:if 로 그리지 않는다 -->
            <div class="d-flex justify-content-end" th:if="${question.author != null}">
                <span class="badge bg-light text-dark p-2" th:text="${question.author.username}"></span>
            </div>
            <!-- 025-05: 글쓴이 본인에게만 보이는 수정 버튼 (책 3-09) -->
            <!--         sec:authorize 로 로그인한 경우만, #authentication.name(로그인 아이디)과 글쓴이가 같을 때만 그린다 -->
            <div class="my-2" sec:authorize="isAuthenticated()"
                 th:if="${question.author != null and #authentication.name == question.author.username}">
                <a th:href="@{|/questions/${question.id}/edit|}" class="btn btn-sm btn-outline-secondary">수정</a>
            </div>
        </div>
    </div>

    <!-- 012-04: 답변 개수와 답변 목록 (책 2-12) -->
    <!--         ${#lists.size(...)} → 타임리프 유틸리티로 목록 크기를 구한다 -->
    <!--         question.answerList 는 LAZY 관계라 이 줄에서 처음 접근할 때 답변을 조회한다 (004-03) -->
    <!-- 014-04: <ul><li> 목록 → 답변마다 카드 하나. 개수 줄에도 구분선과 여백 -->
    <h5 class="border-bottom my-3 py-2" th:text="|${#lists.size(question.answerList)}개의 답변이 있습니다.|"></h5>
    <div class="card my-3" th:each="answer : ${question.answerList}">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;" th:text="${answer.content}"></div>
            <!-- 024-07: 답변 글쓴이 -->
            <div class="d-flex justify-content-end" th:if="${answer.author != null}">
                <span class="badge bg-light text-dark p-2" th:text="${answer.author.username}"></span>
            </div>
        </div>
    </div>

    <!-- 012-03: 답변 입력 폼 (책 2-12) -->
    <!--         th:action → 012-02 의 POST /questions/{id}/answers 로 보낸다 -->
    <!--         textarea 의 name="content" 가 컨트롤러의 @RequestParam content 로 들어간다 -->
    <!-- 014-04: form-control → 부트스트랩 입력칸 모양, btn btn-primary → 파란 버튼 -->
    <!-- 016-10: th:object 로 answerForm 과 연결, th:field 로 name·id·value 채움 (016-06 질문 폼과 같은 방식) -->
    <!--         오류 칸 빨간 테두리(is-invalid), 칸 아래 메시지, 브라우저 검증 required (016-07) -->
    <!--         검증 실패로 다시 열리면 016-08 global.js 가 이 칸에 커서를 둔다 -->
    <form th:action="@{|/questions/${question.id}/answers|}" th:object="${answerForm}" method="post" class="my-3">
        <textarea th:field="*{content}" rows="10" class="form-control" th:errorclass="is-invalid" required></textarea>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
        <input type="submit" value="답변등록" class="btn btn-primary my-2">
    </form>
</div>
</body>
</html>
