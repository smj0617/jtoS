<!-- 015-02: 새 파일. 모든 화면이 함께 쓰는 공통 틀 (강사식 Layout Dialect) -->
<!--         xmlns:layout → layout: 문법을 쓰겠다는 선언 -->
<!--         각 화면은 layout:decorate="~{layout}" 으로 이 틀을 쓰고, layout:fragment="content" 자리에 자기 내용을 넣는다 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <!-- 025-07: global.js 가 만드는 DELETE 폼에 넣을 CSRF 토큰 (폼이 아닌 링크라 th:action 자동 삽입을 쓸 수 없다) -->
    <!--         _csrf → 스프링 시큐리티가 요청마다 넣어 주는 토큰 객체 -->
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <!-- 015-02: 화면마다 반복되던 <head> 3줄을 이곳 한 군데로 옮겨 온다 (014-01, 014-02, 013-02) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/resource/global.css}">
    <!-- 017-03: 부트스트랩 자바스크립트(bundle = Popper 포함). 햄버거 버튼의 메뉴 펼치기(collapse) 같은 동작을 한다 -->
    <!--         CSS(014-01)만으로는 모양만 생기고, 누르면 움직이는 동작은 이 JS 가 있어야 한다. 버전은 CSS 와 같은 5.3.3 -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <!-- 015-06: 공통 자바스크립트. defer → HTML 을 다 읽은 뒤 실행해서 화면 표시가 늦어지지 않는다 -->
    <script defer th:src="@{/resource/global.js}"></script>
    <!-- 015-05: 제목 패턴 (강사식). $LAYOUT_TITLE = 이 틀의 제목(SBB), $CONTENT_TITLE = 화면의 <title> -->
    <!--         목록 화면의 <title>질문 목록</title> 은 최종 HTML 에서 "질문 목록 | SBB" 가 된다 -->
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">SBB</title>
</head>
<body>
<!-- 017-02: navbar.html 의 navbar 조각을 가져와 이 자리를 통째로 바꾼다 (th:replace) -->
<!--         레이아웃에 한 번만 넣으므로 레이아웃을 쓰는 모든 화면 맨 위에 메뉴가 나온다 -->
<nav th:replace="~{navbar :: navbar}"></nav>
<!-- 015-02: 각 화면의 내용이 들어갈 자리 -->
<div layout:fragment="content"></div>
</body>
</html>
