<!-- 023-02: 새 파일. 로그인 화면 (책 3-07) -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>로그인</title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <h5 class="my-3 border-bottom pb-2">로그인</h5>
    <!-- 023-02: 로그인 실패 시 시큐리티가 /members/login?error 로 돌려보낸다 → error 파라미터가 있으면 안내 -->
    <!--         param.error → 주소의 ?error 값. 어느 쪽이 틀렸는지는 일부러 알려 주지 않는다(아이디 존재 여부를 숨긴다) -->
    <div class="alert alert-danger" th:if="${param.error}">아이디 또는 비밀번호를 확인해 주세요.</div>
    <!-- 023-02: POST /members/login 으로 보낸다. 시큐리티가 받는 입력칸 이름은 기본으로 username, password 다 -->
    <form th:action="@{/members/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
    </form>
</div>
</body>
</html>
